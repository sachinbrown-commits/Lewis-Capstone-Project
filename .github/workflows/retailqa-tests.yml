name: RetailQA Cypress Tests

on:
  push:
    branches:
      - Lewis-Capstone-Umair
  pull_request:
    branches:
      - Lewis-Capstone-Umair

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: retailqa-capstone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: retailqa-capstone/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npx cypress run
